<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tolash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   Дизайн-система. Принципы: анимации < 300ms, только
   transform/opacity, сильные кастомные easing-кривые,
   scale(0.97) на нажатии, stagger для списков.
   ============================================================ */
:root {
  color-scheme: light dark;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --bg: var(--tg-theme-bg-color, #f6f7f9);
  --card: var(--tg-theme-secondary-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #16181c);
  --hint: var(--tg-theme-hint-color, #8b909a);
  --accent: var(--tg-theme-button-color, #34c48e);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --green: #34c48e;
  --red: #f0655a;
  --amber: #e8a13c;
  --line: color-mix(in srgb, var(--hint) 18%, transparent);

  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  /* Fullscreen (Bot API 8.0): Telegram сам задаёт эти переменные.
     --tg-safe-area-inset-top — системный статус-бар (часы, батарея),
     --tg-content-safe-area-inset-top — плавающие кнопки Telegram.
     Вне fullscreen обе равны 0, так что отступы ничего не ломают. */
  --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

.money { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* ---------- Каркас ---------- */
#pages {
  padding: calc(16px + var(--safe-top)) 16px calc(84px + var(--safe-bottom));
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
}

.page { display: none; }
.page.active { display: block; animation: page-in 200ms var(--ease-out); }

@keyframes page-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

h1 { font-size: 22px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.02em; }
.sub { color: var(--hint); font-size: 13px; margin-bottom: 16px; }

.section-title {
  font-size: 13px; font-weight: 600; color: var(--hint);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 20px 0 8px; padding: 0 2px;
}

/* ---------- Карточки ---------- */
.card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.pressable {
  transition: transform 160ms var(--ease-out);
  cursor: pointer;
  user-select: none;
}
.pressable:active { transform: scale(0.97); }

/* Stagger для появляющихся списков (декоративно, не блокирует) */
.stagger > * {
  opacity: 0;
  transform: translateY(8px);
  animation: item-in 240ms var(--ease-out) forwards;
}
.stagger > *:nth-child(1) { animation-delay: 0ms; }
.stagger > *:nth-child(2) { animation-delay: 40ms; }
.stagger > *:nth-child(3) { animation-delay: 80ms; }
.stagger > *:nth-child(4) { animation-delay: 120ms; }
.stagger > *:nth-child(5) { animation-delay: 160ms; }
.stagger > *:nth-child(n+6) { animation-delay: 200ms; }

@keyframes item-in {
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Главный экран ---------- */
.hero {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #1d976c));
  color: #fff;
  border-radius: var(--r-lg);
  padding: 18px 16px 14px;
  margin-bottom: 12px;
}
.hero .label { font-size: 13px; opacity: 0.85; }
.hero .big { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin: 2px 0 0; }
.hero .meta { font-size: 12px; opacity: 0.8; margin-top: 2px; }

.seg {
  display: flex; gap: 2px; margin-top: 14px;
  background: rgba(255,255,255,0.16);
  border-radius: 999px; padding: 3px;
  position: relative;
}
.seg button {
  flex: 1; border: 0; background: transparent; color: #fff;
  font-size: 12px; font-weight: 600; padding: 7px 0;
  border-radius: 999px; cursor: pointer;
  transition: background 180ms ease, transform 160ms var(--ease-out);
}
.seg button:active { transform: scale(0.95); }
.seg button.on { background: rgba(255,255,255,0.92); color: #1a7a56; }

.debt-row { display: flex; gap: 10px; }
.debt-card {
  flex: 1; background: var(--card); border-radius: var(--r-lg);
  padding: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.debt-card .t { font-size: 12px; color: var(--hint); font-weight: 600; }
.debt-card .v { font-size: 19px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
.debt-card .v.pos { color: var(--green); }
.debt-card .v.neg { color: var(--red); }

.debt-list-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.debt-list-row:last-child { border-bottom: none; }

/* ---------- Списки счетов ---------- */
.bill-card {
  display: flex; align-items: center; gap: 12px;
}
.bill-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  font-size: 20px;
}
.bill-info { flex: 1; min-width: 0; }
.bill-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bill-meta { font-size: 12px; color: var(--hint); margin-top: 2px; }
.bill-right { text-align: right; flex-shrink: 0; }
.bill-sum { font-weight: 700; font-size: 15px; }
.chip {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; margin-top: 3px;
  background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber);
}
.chip.closed { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }

/* ---------- Кнопки ---------- */
.btn {
  width: 100%; padding: 15px; border-radius: var(--r-md); border: none;
  font-size: 16px; font-weight: 700; font-family: inherit;
  background: var(--accent); color: var(--accent-text);
  cursor: pointer; margin-top: 8px;
  transition: transform 160ms var(--ease-out), opacity 160ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; }
.btn.ghost {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--accent);
}
.btn.danger { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.btn.small { width: auto; padding: 9px 14px; font-size: 13px; margin: 0; border-radius: var(--r-sm); }

/* ---------- Сканер ---------- */
.upload-zone {
  border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 5%, transparent);
  border-radius: var(--r-lg); padding: 44px 20px; text-align: center;
  cursor: pointer;
  transition: transform 160ms var(--ease-out), background 200ms ease;
}
.upload-zone:active { transform: scale(0.98); }
.upload-zone .ico { font-size: 44px; }
.upload-zone .t1 { font-weight: 700; margin-top: 10px; font-size: 16px; }
.upload-zone .t2 { color: var(--hint); font-size: 13px; margin-top: 4px; }
input[type=file] { display: none; }

.scanning {
  text-align: center; padding: 42px 20px;
}
.scan-frame {
  width: 120px; height: 150px; margin: 0 auto 18px;
  border-radius: var(--r-md); position: relative; overflow: hidden;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.scan-line {
  position: absolute; left: 8px; right: 8px; height: 2px; border-radius: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: scan 1.3s var(--ease-in-out) infinite alternate;
}
@keyframes scan {
  from { transform: translateY(10px); }
  to   { transform: translateY(136px); }
}

.step-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 14px; color: var(--hint); }
.step-row.done { color: var(--text); }
.step-dot {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.step-row.done .step-dot { border-color: var(--green); background: var(--green); color: #fff; }

/* ---------- Позиции чека ---------- */
.item-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.item-row:last-child { border-bottom: none; }
.checkbox {
  width: 23px; height: 23px; border-radius: 7px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid color-mix(in srgb, var(--hint) 45%, transparent);
  transition: background 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
  display: flex; align-items: center; justify-content: center;
}
.item-row:active .checkbox { transform: scale(0.9); }
.checkbox.on { background: var(--accent); border-color: var(--accent); }
.checkbox svg { opacity: 0; transform: scale(0.6); transition: opacity 150ms ease, transform 180ms var(--ease-out); }
.checkbox.on svg { opacity: 1; transform: scale(1); }
.item-body { flex: 1; min-width: 0; cursor: pointer; }
.item-name { font-weight: 600; font-size: 14.5px; }
.item-price { font-size: 12.5px; color: var(--hint); margin-top: 1px; }
.avatars { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.avatar-chip {
  font-size: 11px; padding: 2.5px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--hint) 16%, transparent);
}
.avatar-chip.me { background: var(--accent); color: var(--accent-text); }
.del-item {
  border: none; background: none; color: var(--hint); font-size: 17px;
  cursor: pointer; padding: 2px 4px; flex-shrink: 0;
  transition: transform 160ms var(--ease-out), color 150ms ease;
}
.del-item:active { transform: scale(0.85); color: var(--red); }

.total-row {
  display: flex; justify-content: space-between;
  font-size: 17px; font-weight: 800; padding-top: 4px;
}
.split-row { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14.5px; border-bottom: 1px solid var(--line); }
.split-row:last-child { border-bottom: none; }
.warn { color: var(--amber); font-size: 13px; margin-top: 8px; line-height: 1.4; }

/* ---------- Профиль ---------- */
.profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.avatar-big {
  width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #1d976c);
  color: #fff; font-size: 26px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  background-size: cover; background-position: center;
}
.stat-grid { display: flex; gap: 10px; }
.stat-cell { flex: 1; text-align: center; padding: 14px 6px; background: var(--card); border-radius: var(--r-md); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.stat-cell .v { font-size: 18px; font-weight: 800; }
.stat-cell .t { font-size: 11.5px; color: var(--hint); margin-top: 2px; }

.lang-row { display: flex; gap: 8px; }
.lang-pill {
  flex: 1; padding: 11px 0; text-align: center; border-radius: var(--r-md);
  background: var(--card); font-weight: 600; font-size: 14px; cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out);
}
.lang-pill:active { transform: scale(0.96); }
.lang-pill.on { border-color: var(--accent); color: var(--accent); }

.prof-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px;
}
.prof-row:last-child { border-bottom: none; }
.prof-row .k { color: var(--hint); }

/* ---------- Нижняя навигация ---------- */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom);
}
#tabbar .inner { display: flex; max-width: 520px; margin: 0 auto; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 0 7px; border: none; background: none; cursor: pointer;
  color: var(--hint); font-size: 10.5px; font-weight: 600; font-family: inherit;
  transition: color 150ms ease, transform 160ms var(--ease-out);
}
.tab:active { transform: scale(0.92); }
.tab.on { color: var(--accent); }
.tab svg { width: 23px; height: 23px; }

/* ---------- Шторка (bottom sheet) ---------- */
#sheet-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 250ms ease;
}
#sheet-backdrop.open { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  padding: 8px 18px calc(20px + var(--safe-bottom));
  max-width: 520px; margin: 0 auto;
  transform: translateY(100%);
  transition: transform 400ms var(--ease-drawer);
  max-height: 88vh; overflow-y: auto;
}
#sheet.open { transform: translateY(0); }
#sheet.dragging { transition: none; }
.sheet-grip {
  width: 38px; height: 4.5px; border-radius: 3px;
  background: color-mix(in srgb, var(--hint) 35%, transparent);
  margin: 6px auto 14px;
}
.sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.01em; }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12.5px; color: var(--hint); font-weight: 600; margin-bottom: 5px; }
.field input {
  width: 100%; padding: 13px 14px; border-radius: var(--r-md);
  border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
  font-size: 16px; font-family: inherit; outline: none;
  transition: border-color 150ms ease;
}
.field input:focus { border-color: var(--accent); }
.field-inline { display: flex; gap: 8px; }
.field-inline .field { flex: 1; }

/* ---------- Тост ---------- */
#toast {
  position: fixed; top: calc(12px + var(--safe-top)); left: 50%; z-index: 200;
  transform: translate(-50%, -160%);
  background: var(--text); color: var(--bg);
  padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  transition: transform 300ms var(--ease-out);
  max-width: 88vw; text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18);
}
#toast.show { transform: translate(-50%, 0); }

/* ---------- Скелетоны ---------- */
.skel {
  border-radius: var(--r-lg); background: var(--card);
  position: relative; overflow: hidden; margin-bottom: 10px;
}
.skel::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--hint) 8%, transparent), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

.empty { text-align: center; padding: 36px 20px; color: var(--hint); }
.empty .ico { font-size: 42px; margin-bottom: 8px; }
.empty .t { font-size: 14px; line-height: 1.5; }

.back-btn {
  display: inline-flex; align-items: center; gap: 5px;
  border: none; background: none; color: var(--accent);
  font-size: 15px; font-weight: 600; font-family: inherit;
  padding: 4px 0; margin-bottom: 8px; cursor: pointer;
  transition: transform 160ms var(--ease-out);
}
.back-btn:active { transform: scale(0.95); }

/* ---------- Онбординг ---------- */
#onboarding {
  position: fixed; inset: 0; z-index: 300;
  background: var(--bg);
  display: flex; flex-direction: column;
  padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
  overflow-y: auto;
}
.onb-skip {
  position: absolute; top: calc(14px + var(--safe-top)); right: 18px;
  border: none; background: none; color: var(--hint); font-size: 14px;
  font-weight: 600; font-family: inherit; cursor: pointer; padding: 6px;
}
.onb-body {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  text-align: center; max-width: 420px; margin: 0 auto; width: 100%;
  animation: page-in 240ms var(--ease-out);
}
.onb-emoji { font-size: 72px; margin-bottom: 18px; }
.onb-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
.onb-desc { font-size: 15px; color: var(--hint); line-height: 1.55; margin-bottom: 28px; }
.onb-langs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.onb-lang {
  padding: 15px; border-radius: var(--r-md); background: var(--card);
  font-size: 16px; font-weight: 600; cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 150ms ease, transform 160ms var(--ease-out);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.onb-lang:active { transform: scale(0.97); }
.onb-lang.on { border-color: var(--accent); color: var(--accent); }
.onb-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
.onb-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: color-mix(in srgb, var(--hint) 30%, transparent);
  transition: background 200ms ease, transform 200ms var(--ease-out);
}
.onb-dot.on { background: var(--accent); transform: scale(1.25); }
.onb-later {
  border: none; background: none; color: var(--hint); font-size: 14px;
  font-family: inherit; cursor: pointer; margin-top: 14px; padding: 6px;
}

/* ---------- Друзья ---------- */
.friend-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.friend-row:last-child { border-bottom: none; }
.friend-ava {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent); font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.friend-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; }
.friend-badge { font-size: 10.5px; color: var(--hint); }

@media (prefers-reduced-motion: reduce) {
  .page.active, .stagger > * { animation: none; opacity: 1; transform: none; }
  .scan-line { animation-duration: 2.5s; }
  #sheet { transition: opacity 200ms ease; }
}
</style>
</head>
<body>

<div id="pages">
  <div class="page" id="page-home"></div>
  <div class="page" id="page-splits"></div>
  <div class="page" id="page-scan"></div>
  <div class="page" id="page-profile"></div>
  <div class="page" id="page-bill"></div>
</div>

<nav id="tabbar">
  <div class="inner">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span data-i18n="tab_home"></span>
    </button>
    <button class="tab" data-tab="splits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.6c2.4.2 4.3 1.8 4.9 4.4"/></svg>
      <span data-i18n="tab_splits"></span>
    </button>
    <button class="tab" data-tab="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
      <span data-i18n="tab_scan"></span>
    </button>
    <button class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c.8-3.8 3.6-5.8 7-5.8s6.2 2 7 5.8"/></svg>
      <span data-i18n="tab_profile"></span>
    </button>
  </div>
</nav>

<div id="sheet-backdrop"></div>
<div id="sheet"></div>

function detectLang(tgUser) {
  if (LANG) return LANG;
  const code = ((tgUser && tgUser.language_code) || "ru").toLowerCase();
  LANG = code.startsWith("uz") ? "uz" : code.startsWith("en") ? "en" : "ru";
  return LANG;
}

// Шапка и системные области Telegram — в цвет фона приложения, чтобы
// приложение выглядело единым целым (без белой полосы сверху).
function syncTelegramChrome() {
  try {
    tg.setHeaderColor("bg_color");
    tg.setBackgroundColor("bg_color");
    if (tg.setBottomBarColor) tg.setBottomBarColor("bg_color");
  } catch (e) {}
}
syncTelegramChrome();
try { tg.onEvent("themeChanged", syncTelegramChrome); } catch (e) {}

// Fullscreen (Bot API 8.0): раскрываем приложение на весь экран, но только
// на телефонах — на компьютере и в вебе fullscreen для Mini App выглядит
// плохо, там остаётся обычное окно. Старые клиенты Telegram (< 8.0) метод
// не знают — для них всё работает как раньше, просто без fullscreen.
function enterFullscreen() {
  try {
    const mobile = tg.platform === "ios" || tg.platform === "android";
    if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") &&
        tg.requestFullscreen && !tg.isFullscreen) {
      tg.requestFullscreen();
    }
  } catch (e) {}
}
enterFullscreen();
// Если клиент не смог войти в fullscreen — молча живём в обычном режиме
try { tg.onEvent("fullscreenFailed", () => {}); } catch (e) {}
// В fullscreen жест "свайп вниз" не должен случайно сворачивать приложение
// при прокрутке списков (Bot API 7.7)
try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}

const initData = tg.initData || "";
const me = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Пробуждаем бесплатный Render СРАЗУ при открытии приложения — пока
// пользователь смотрит онбординг/анимации, сервер уже поднимается.
try { fetch(API_BASE + "/api/ping").catch(() => {}); } catch (e) {}

async function api(path, options = {}) {
  // Надёжная загрузка: GET-запросы сами повторяются до 4 раз с паузами
  // (2с → 4с → 8с → 12с) — этого хватает, чтобы "уснувший" бесплатный
  // сервер успел проснуться (до ~60с). Экран ошибки — только если сервер
  // реально недоступен. POST/DELETE не повторяем, чтобы не задвоить данные.
  const method = (options.method || "GET").toUpperCase();
  const canRetry = method === "GET";
  const delays = [2000, 4000, 8000, 12000];

  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 65000);
    try {
      const res = await fetch(API_BASE + path, {
        ...options,
        signal: ctrl.signal,
        headers: { "X-Telegram-Init-Data": initData, ...(options.headers || {}) },
      });
      if (!res.ok) {
        // 5xx — сервер поднимается/упал: пробуем ещё; 4xx — повторять бессмысленно
        if (res.status >= 500 && canRetry && attempt < delays.length) {
          clearTimeout(timer);
          await sleep(delays[attempt]);
          continue;
        }
        throw new Error(`${res.status}: ${await res.text()}`);
      }
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      const netFail = e.name === "AbortError" || e.name === "TypeError" || e instanceof TypeError;
      if (netFail && canRetry && attempt < delays.length) {
        await sleep(delays[attempt]);
        continue;
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }
}

// Экран ошибки с кнопкой "Повторить" — вместо вечных скелетонов
function errorState(retryFn, err) {
  const id = "retry_" + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const b = document.getElementById(id);
    if (b) b.addEventListener("click", retryFn);
  }, 0);
  // 404 на новых эндпоинтах = на сервере задеплоен СТАРЫЙ backend
  const outdated = err && String(err.message || "").startsWith("404");
  const text = outdated
    ? "На сервере старая версия backend — новые функции ему неизвестны. Загрузите папку backend/ на GitHub и дождитесь деплоя Render (Dashboard → Events: должно быть «Deploy live», а не «Deploy failed»)."
    : t("err_net");
  return `
    <div class="empty">
      <div class="ico">${outdated ? "🔄" : "📡"}</div>
      <div class="t">${text}</div>
      <button class="btn ghost small" id="${id}" style="margin-top:14px">↻ ${t("retry")}</button>
    </div>`;
}
const apiJson = (path, method, body) =>
  api(path, { method, body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });

/* ============================================================
   Кэш GET-запросов (stale-while-revalidate).
   Вкладка рисуется МГНОВЕННО из localStorage, а свежие данные
   тихо подтягиваются в фоне и дорисовываются, только если
   что-то изменилось и пользователь всё ещё на этом экране.
   ============================================================ */
const CACHE_NS = "tolash_cache:";
function cacheRead(key) {
  try {
    const raw = localStorage.getItem(CACHE_NS + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function cacheWrite(key, data) {
  try { localStorage.setItem(CACHE_NS + key, JSON.stringify(data)); } catch (e) {}
}

// Дедупликация: один и тот же запрос (предзагрузка + открытие вкладки)
// не летит на сервер дважды — второй вызов получает тот же промис.
const inflight = {};
function fetchOnce(key, fetcher) {
  if (!inflight[key]) {
    inflight[key] = fetcher()
      .then((data) => { cacheWrite(key, data); return data; })
      .finally(() => { delete inflight[key]; });
  }
  return inflight[key];
}

// swr: если есть кэш — render(кэш) сразу; затем fetch и повторный render,
// если данные изменились и guard() всё ещё истинен (экран не сменился).
// Без кэша при ошибке сети бросает исключение — вызывающий покажет errorState.
async function swr(key, fetcher, render, guard) {
  const cached = cacheRead(key);
  if (cached !== null) {
    try { render(cached); } catch (e) {}
  }
  try {
    const fresh = await fetchOnce(key, fetcher);
    if (JSON.stringify(fresh) === JSON.stringify(cached)) return;
    if (!guard || guard()) render(fresh);
  } catch (e) {
    if (cached === null) throw e; // кэша нет — наверху покажут экран ошибки
  }
}

// Тёплый старт: сразу после входа тихо загружаем данные всех вкладок,
// чтобы переключение между ними было мгновенным.
function prefetchAll() {
  fetchOnce("home_" + period, () =>
    Promise.all([api(`/api/me/summary?period=${period}`), api(`/api/me/debts`)])
  ).catch(() => {});
  fetchOnce("bills", () => api("/api/me/bills")).catch(() => {});
  fetchOnce("profile", async () => ({
    prof: await api("/api/me").catch(() => null),
    friends: await api("/api/friends").catch(() => []),
  })).catch(() => {});
}

/* ============================================================
   Утилиты
   ============================================================ */
function fmt(n, currency) {
  const num = Number(n) || 0;
  const isUZS = !currency || currency === "UZS";
  const s = num.toLocaleString("ru-RU", { maximumFractionDigits: isUZS ? 0 : 2 });
  const cur = isUZS ? t("currency_uzs") : currency;
  return `${s} ${cur}`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  const d = new Date(iso), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days === 0) return d.toLocaleTimeString(LANG === "en" ? "en-GB" : "ru-RU", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString(LANG === "en" ? "en-GB" : "ru-RU", { day: "numeric", month: "short" });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function haptic(type = "light") {
  try { tg.HapticFeedback.impactOccurred(type); } catch (e) {}
}

const checkSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>`;
const skeletons = (n = 3, h = 76) =>
  Array.from({ length: n }, () => `<div class="skel" style="height:${h}px"></div>`).join("");

  haptic();
  openSheet(`
    <div class="sheet-title">${t("new_split_title")}</div>

  `);

  btn.addEventListener("click", async () => {
    const name = document.getElementById("splitName").value.trim();

    btn.disabled = true; btn.textContent = t("creating");
    try {
      const bill = await apiJson("/api/bills/manual", "POST", { title: name, currency: "UZS", items: [] });
      closeSheet();
      openBill(bill.id);
    } catch (e) {
      toast(t("error") + ": " + e.message);
      btn.disabled = false; btn.textContent = t("create");
    }
  });
  setTimeout(() => document.getElementById("splitName").focus(), 420);
}

async function onPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  haptic("medium");
  const el = document.getElementById("page-scan");
  el.innerHTML = `
    <h1>${t("scan_title")}</h1>
    <div class="scanning">
      <div class="scan-frame"><div class="scan-line"></div></div>
      <div style="font-weight:700;font-size:16px">${t("scanning")}</div>
      <div style="max-width:240px;margin:16px auto 0;text-align:left">
        <div class="step-row done"><div class="step-dot">✓</div>${t("scan_step1")}</div>
        <div class="step-row" id="st2"><div class="step-dot"></div>${t("scan_step2")}</div>
        <div class="step-row" id="st3"><div class="step-dot"></div>${t("scan_step3")}</div>
      </div>
    </div>
  `;
  const st2 = setTimeout(() => { const s = document.getElementById("st2"); if (s) { s.classList.add("done"); s.querySelector(".step-dot").textContent = "✓"; } }, 1800);
  const st3 = setTimeout(() => { const s = document.getElementById("st3"); if (s) { s.classList.add("done"); s.querySelector(".step-dot").textContent = "✓"; } }, 3600);

  const form = new FormData();
  form.append("photo", file);
  try {
    const bill = await api("/api/bills", { method: "POST", body: form });
    clearTimeout(st2); clearTimeout(st3);
    haptic("medium");
    openBill(bill.id);
  } catch (err) {
    clearTimeout(st2); clearTimeout(st3);
    renderScan();
    toast(t("scan_fail"));
  }
}

async function openBill(billId) {
  currentBillId = billId;
  document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
  const el = document.getElementById("page-bill");
  el.classList.add("active");
  window.scrollTo(0, 0);

  if (!cacheRead(key)) {
    el.innerHTML = `<button class="back-btn" id="backBtn">‹ ${t("bill_back")}</button>${skeletons(3)}`;
    el.querySelector("#backBtn").addEventListener("click", () => showTab(currentTab));
  }
  try {
    await swr(
      key,
      () => api(`/api/bills/${billId}`),
      (bill) => renderBillView(el, bill),
      () => String(currentBillId) === String(billId) && el.classList.contains("active"),
    );
  } catch (e) {
    el.innerHTML = `
      <button class="back-btn" id="backBtn">‹ ${t("bill_back")}</button>
      <div class="empty"><div class="ico">🔍</div><div class="t">${t("bill_not_found")}</div></div>`;
    el.querySelector("#backBtn").addEventListener("click", () => showTab(currentTab));
  }
}

function renderBillView(el, bill) {
  const isCreator = bill.creator_id === me.id;
  const isOpen = bill.status !== "closed";
  const myP = bill.participants.find((p) => p.user_id === me.id);
  const myConfirmed = !!(myP && myP.confirmed);

  const guests = bill.participants.filter((p) => p.is_guest);
  const hasGuests = guests.length > 0;

  const rows = bill.items.map((item) => {
    const myShare = item.shares.find((s) => s.user_id === me.id);
    const chips = item.shares.map((s) => {
      const p = bill.participants.find((x) => x.user_id === s.user_id);
      const nm = p ? (p.name || s.user_id) : s.user_id;
      const g = p && p.is_guest ? "👤 " : "";
      return `<span class="avatar-chip ${s.user_id === me.id ? "me" : ""}">${g}${esc(nm)}</span>`;
    }).join("");
    const guestBtn = hasGuests && isOpen
      ? `<span class="avatar-chip guest-assign" data-gitem="${item.id}" style="cursor:pointer;border:1.5px dashed color-mix(in srgb, var(--hint) 45%, transparent);background:transparent">👤＋</span>`
      : "";
    return `
      <div class="item-row">
        <div class="checkbox ${myShare ? "on" : ""}" data-check="${item.id}" data-on="${!!myShare}">${checkSvg}</div>
        <div class="item-body" data-claim="${item.id}" data-on="${!!myShare}">
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-price money">${fmt(item.total_price, bill.currency)}${item.qty > 1 ? " · " + item.qty : ""}</div>
          <div class="avatars">${chips}${guestBtn}</div>
        </div>
        ${isCreator && isOpen ? `<button class="del-item" data-edit="${item.id}">✎</button>` : ""}
      </div>`;
  }).join("");

  // Участники и их статус подтверждения (гости не подтверждают — у них нет Telegram)
  const partChips = bill.participants.map((p) => `
    <span class="avatar-chip ${p.user_id === me.id ? "me" : ""}">${p.is_guest ? "👤 " : (p.confirmed ? "✓ " : "")}${esc(p.name || p.user_id)}</span>`).join("");
  const addPartChip = isOpen
    ? `<span class="avatar-chip" id="addPartChip" style="cursor:pointer;border:1.5px dashed color-mix(in srgb, var(--hint) 45%, transparent);background:transparent">＋ ${t("add_participant")}</span>`
    : "";
  const realParts = bill.participants.filter((p) => !p.is_guest);
  const allConfirmed = realParts.length > 0 && realParts.every((p) => p.confirmed);

  el.innerHTML = `
    <button class="back-btn" id="backBtn">‹ ${t("bill_back")}</button>
    <div style="display:flex;align-items:center;gap:8px">
      <h1 style="flex:1;min-width:0">${esc(bill.title)}</h1>
      ${isCreator && isOpen ? `<button class="del-item" id="renameBtn" title="${t("rename")}">✎</button>` : ""}
    </div>
    <div class="sub">${t("bill_hint")}</div>

    <div class="card">
      ${rows || ""}
      ${isOpen ? `<div style="padding:10px 0 2px">
        <button class="btn ghost small" id="addItemBtn">＋ ${t("add_item")}</button>
      </div>` : ""}
    </div>

    <div class="card">
      <div class="total-row"><span>${t("total")}</span><span class="money">${fmt(bill.total, bill.currency)}</span></div>
    </div>

    ${isOpen ? `
    <div class="card">
      <div style="font-size:12.5px;color:var(--hint);line-height:1.45;margin-bottom:9px">🔒 ${t("confirm_hint")}</div>
      <div class="avatars" style="margin-bottom:10px">${partChips}${addPartChip}</div>
      ${allConfirmed ? `<div style="font-size:13px;color:var(--green);font-weight:600;margin-bottom:8px">${t("all_confirmed")}</div>` : ""}
      <button class="btn ${myConfirmed ? "ghost" : ""} small" id="confirmBtn" style="width:100%">
        ${myConfirmed ? "✓ " + t("confirmed_you") + " · " + t("change_choice") : "✅ " + t("confirm_choice")}
      </button>
    </div>` : ""}

    <button class="btn ghost" id="inviteBtn">👥 ${t("invite")}</button>
    <button class="btn" id="splitBtn">💸 ${t("calc")}</button>
    <div id="splitResult"></div>
    ${isCreator && isOpen ? `<button class="btn danger" id="closeBillBtn">${t("close_bill")}</button>` : ""}
  `;

  el.querySelector("#backBtn").addEventListener("click", () => showTab(currentTab));

  // Мутирующие эндпоинты сами возвращают обновлённый счёт — используем
  // их ответ напрямую, без лишнего повторного GET (вдвое меньше запросов).
  const refresh = async (updated) => {
    const fresh = updated || await api(`/api/bills/${bill.id}`);
    cacheWrite("bill_" + bill.id, fresh);
    renderBillView(el, fresh);
  };

  // Отметить/снять позицию (галочка переключается мгновенно, до ответа сервера)
  el.querySelectorAll("[data-claim],[data-check]").forEach((node) =>
    node.addEventListener("click", async () => {
      if (!isOpen) return;
      haptic();
      const itemId = node.dataset.claim || node.dataset.check;
      const isOn = node.dataset.on === "true";
      const box = el.querySelector(`[data-check="${itemId}"]`);
      if (box) box.classList.toggle("on", !isOn);
      try {
        let updated;
        if (isOn) {
          updated = await api(`/api/bills/${bill.id}/claims/${itemId}`, { method: "DELETE" });
        } else {
          const form = new FormData();
          form.append("item_id", itemId);
          form.append("weight", "1");
          updated = await api(`/api/bills/${bill.id}/claims`, { method: "POST", body: form });
        }
        await refresh(updated);
      } catch (e) {
        if (box) box.classList.toggle("on", isOn);
        toast(t("error") + ": " + e.message);
      }
    }));

  // Общая шторка позиции: добавление и редактирование
  function itemSheet(item) {
    const isEdit = !!item;
    openSheet(`
      <div class="sheet-title">${isEdit ? t("edit_item") : t("add_item")}</div>
      <div class="field"><label>${t("item_name")}</label><input id="itName" maxlength="80" value="${isEdit ? esc(item.name) : ""}"></div>
      <div class="field-inline">
        <div class="field"><label>${t("item_price")}</label><input id="itPrice" type="number" inputmode="decimal" min="0" value="${isEdit ? item.total_price : ""}"></div>
        <div class="field" style="max-width:110px"><label>${t("item_qty")}</label><input id="itQty" type="number" inputmode="numeric" min="1" value="${isEdit ? item.qty : 1}"></div>
      </div>
      <button class="btn" id="itSaveBtn">${isEdit ? t("save") : t("add")}</button>
      ${isEdit ? `<button class="btn danger" id="itDelBtn">🗑 ${t("delete_item")}</button>` : ""}
    `);
    document.getElementById("itSaveBtn").addEventListener("click", async () => {
      const name = document.getElementById("itName").value.trim();
      const price = parseFloat(document.getElementById("itPrice").value) || 0;
      const qty = parseFloat(document.getElementById("itQty").value) || 1;
      if (!name || price <= 0) return;
      const body = { name, qty, unit_price: price / qty, total_price: price };
      try {
        let updated;
        if (isEdit) {
          updated = await apiJson(`/api/bills/${bill.id}/items/${item.id}`, "PATCH", body);
        } else {
          updated = await apiJson(`/api/bills/${bill.id}/items`, "POST", body);
        }
        closeSheet();
        toast(isEdit ? t("saved") : t("added"));
        haptic("medium");
        await refresh(updated);
      } catch (e) { toast(t("error") + ": " + e.message); }
    });
    if (isEdit) document.getElementById("itDelBtn").addEventListener("click", async () => {
      haptic("medium");
      try {
        const updated = await api(`/api/bills/${bill.id}/items/${item.id}`, { method: "DELETE" });
        closeSheet();
        toast(t("removed"));
        await refresh(updated);
      } catch (e) { toast(t("error") + ": " + e.message); }
    });
    if (!isEdit) setTimeout(() => document.getElementById("itName").focus(), 420);
  }

  const addBtn = el.querySelector("#addItemBtn");
  if (addBtn) addBtn.addEventListener("click", () => { haptic(); itemSheet(null); });

  // Редактировать позицию (только создатель)
  el.querySelectorAll("[data-edit]").forEach((btn) =>
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      haptic();
      const item = bill.items.find((i) => i.id === Number(btn.dataset.edit));
      if (item) itemSheet(item);
    }));

  // Переименовать счёт
  const renameBtn = el.querySelector("#renameBtn");
  if (renameBtn) renameBtn.addEventListener("click", () => {
    haptic();
    openSheet(`
      <div class="sheet-title">${t("rename")}</div>
      <div class="field"><label>${t("split_name")}</label><input id="renName" maxlength="60" value="${esc(bill.title)}"></div>
      <button class="btn" id="renSaveBtn">${t("save")}</button>
    `);
    document.getElementById("renSaveBtn").addEventListener("click", async () => {
      const title = document.getElementById("renName").value.trim();
      if (!title) return;
      try {
        const updated = await apiJson(`/api/bills/${bill.id}`, "PATCH", { title });
        closeSheet();
        toast(t("saved"));
        await refresh(updated);
      } catch (e) { toast(t("error") + ": " + e.message); }
    });
  });

  // Подтверждение выбора (антифрод)
  const confirmBtn = el.querySelector("#confirmBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", async () => {
    haptic("medium");
    try {
      const updated = await api(`/api/bills/${bill.id}/confirm`, { method: myConfirmed ? "DELETE" : "POST" });
      await refresh(updated);
    } catch (e) { toast(t("error") + ": " + e.message); }
  });

  // Добавить участника: из друзей или гостя без Telegram
  const addPart = el.querySelector("#addPartChip");
  if (addPart) addPart.addEventListener("click", async () => {
    haptic();
    let friends = [];
    try { friends = await api("/api/friends"); } catch (e) {}
    const inBill = new Set(bill.participants.map((p) => p.user_id));
    const candidates = friends.filter((f) => !inBill.has(f.user_id));
    const friendRows = candidates.map((f) => `
      <div class="friend-row pressable" data-add-friend="${f.user_id}" style="cursor:pointer">
        <div class="friend-ava">${esc((f.name || "?").charAt(0).toUpperCase())}</div>
        <div class="friend-name">${esc(f.name)}</div>
        <span style="color:var(--accent);font-weight:700;font-size:18px">＋</span>
      </div>`).join("");
    openSheet(`
      <div class="sheet-title">${t("add_participant")}</div>
      <div class="section-title" style="margin-top:0">${t("from_friends")}</div>
      ${friendRows || `<div class="empty" style="padding:10px"><div class="t">${friends.length ? t("all_in_bill") : t("no_friends")}</div></div>`}
      <div class="section-title">${t("or_guest")}</div>
      <div class="field"><label>${t("guest_name")}</label><input id="guestName" maxlength="40"></div>
      <button class="btn ghost" id="guestAddBtn">👤 ${t("add_guest")}</button>
    `);
    document.querySelectorAll("[data-add-friend]").forEach((row) =>
      row.addEventListener("click", async () => {
        haptic("medium");
        try {
          const updated = await apiJson(`/api/bills/${bill.id}/participants`, "POST", { user_id: Number(row.dataset.addFriend) });
          closeSheet();
          toast(t("friend_added"));
          await refresh(updated);
        } catch (e) { toast(t("error") + ": " + e.message); }
      }));
    document.getElementById("guestAddBtn").addEventListener("click", async () => {
      const name = document.getElementById("guestName").value.trim();
      if (!name) return;
      haptic("medium");
      try {
        const updated = await apiJson(`/api/bills/${bill.id}/guests`, "POST", { name });
        closeSheet();
        toast(t("added"));
        await refresh(updated);
      } catch (e) { toast(t("error") + ": " + e.message); }
    });
  });

  // Отметить позицию за гостя (у гостя нет Telegram — отмечает компания)
  el.querySelectorAll(".guest-assign").forEach((chip) =>
    chip.addEventListener("click", (ev) => {
      ev.stopPropagation();
      haptic();
      const item = bill.items.find((i) => i.id === Number(chip.dataset.gitem));
      if (!item) return;
      const rows3 = guests.map((g) => {
        const has = item.shares.some((s) => s.user_id === g.user_id);
        return `
        <div class="friend-row pressable" data-toggle-guest="${g.user_id}" style="cursor:pointer">
          <div class="friend-ava">👤</div>
          <div class="friend-name">${esc(g.name)}</div>
          <div class="checkbox ${has ? "on" : ""}">${checkSvg}</div>
        </div>`;
      }).join("");
      openSheet(`
        <div class="sheet-title">${t("pick_who")}</div>
        <div style="font-size:13px;color:var(--hint);margin:-6px 0 10px">${esc(item.name)} · <span class="money">${fmt(item.total_price, bill.currency)}</span></div>
        ${rows3}
      `);
      document.querySelectorAll("[data-toggle-guest]").forEach((row) =>
        row.addEventListener("click", async () => {
          haptic("medium");
          const gid = Number(row.dataset.toggleGuest);
          const has = item.shares.some((s) => s.user_id === gid);
          try {
            let updated;
            if (has) {
              updated = await api(`/api/bills/${bill.id}/claims/${item.id}?for_user_id=${gid}`, { method: "DELETE" });
            } else {
              const form = new FormData();
              form.append("item_id", item.id);
              form.append("weight", "1");
              form.append("for_user_id", gid);
              updated = await api(`/api/bills/${bill.id}/claims`, { method: "POST", body: form });
            }
            closeSheet();
            await refresh(updated);
          } catch (e) { toast(t("error") + ": " + e.message); }
        }));
    }));

  // Пригласить
  el.querySelector("#inviteBtn").addEventListener("click", () => {
    haptic();
    const link = `https://t.me/${BOT_USERNAME}?start=${bill.id}`;
    const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(t("invite_text"))}`;
    try { tg.openTelegramLink(shareUrl); }
    catch (e) { navigator.clipboard.writeText(link); toast("🔗 " + link); }
  });

  // Расчёт
  el.querySelector("#splitBtn").addEventListener("click", async () => {
    haptic("medium");
    const box = el.querySelector("#splitResult");
    box.innerHTML = `<div class="skel" style="height:90px;margin-top:10px"></div>`;
    try {
      const split = await api(`/api/bills/${bill.id}/split`);
      const rows2 = split.per_user.map((u) => `
        <div class="split-row"><span>${esc(u.name)}</span><b class="money">${fmt(u.amount, split.currency)}</b></div>`).join("");
      const note = split.fully_claimed ? "" :
        `<div class="warn">ℹ️ ${t("calc_note")} (${fmt(split.unclaimed_amount, split.currency)})</div>`;
      const okLine = split.all_confirmed ?
        `<div style="font-size:13px;color:var(--green);font-weight:600;margin-top:8px">${t("all_confirmed")}</div>` : "";
      box.innerHTML = `<div class="card" style="margin-top:10px">${rows2}${note}${okLine}</div>`;
    } catch (e) { box.innerHTML = ""; toast(t("error") + ": " + e.message); }
  });

  // Закрыть счёт
  const closeBtn = el.querySelector("#closeBillBtn");
  if (closeBtn) closeBtn.addEventListener("click", async () => {
    haptic("medium");
    try {
      await apiJson(`/api/bills/${bill.id}/close`, "POST", {});
      toast(t("closed_ok"));
      showTab("splits");
    } catch (e) { toast(t("error") + ": " + e.message); }
  });
}

/* ============================================================
   Bottom sheet: открытие/закрытие + свайп вниз
   ============================================================ */
const sheet = document.getElementById("sheet");
const backdrop = document.getElementById("sheet-backdrop");

function openSheet(html) {
  sheet.innerHTML = `<div class="sheet-grip"></div>` + html;
  requestAnimationFrame(() => {
    sheet.classList.add("open");
    backdrop.classList.add("open");
  });
}
function closeSheet() {
  sheet.classList.remove("open", "dragging");
  sheet.style.transform = "";
  backdrop.classList.remove("open");
}
backdrop.addEventListener("click", closeSheet);

// Драг-жест: скорость > 0.11 — закрываем независимо от дистанции;
// вверх — с затуханием (damping), а не жёсткий стоп.
let dragStartY = 0, dragDelta = 0, dragT0 = 0, dragging = false;
sheet.addEventListener("pointerdown", (e) => {
  if (["INPUT", "BUTTON", "TEXTAREA"].includes(e.target.tagName)) return;
  if (sheet.scrollTop > 2) return;
  dragging = true; dragStartY = e.clientY; dragDelta = 0; dragT0 = Date.now();
  sheet.classList.add("dragging");
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  dragDelta = e.clientY - dragStartY;
  const y = dragDelta > 0 ? dragDelta : dragDelta * 0.15; // затухание вверх
  sheet.style.transform = `translateY(${y}px)`;
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  sheet.classList.remove("dragging");
  const velocity = Math.abs(dragDelta) / Math.max(1, Date.now() - dragT0);
  if (dragDelta > 120 || (dragDelta > 20 && velocity > 0.11)) closeSheet();
  else sheet.style.transform = "";
};
sheet.addEventListener("pointerup", endDrag);
sheet.addEventListener("pointercancel", endDrag);

/* ============================================================
   Онбординг: язык → номер телефона → 3 слайда о сервисе
   ============================================================ */
const ONB_KEY = "tolash_onboarded_v1";

function startApp() {
  if (currentBillId) {
    showTab("splits");
    openBill(currentBillId);
  } else {
    showTab("home");
  }
  prefetchAll();
}

function finishOnboarding() {
  localStorage.setItem(ONB_KEY, "1");
  localStorage.setItem("tolash_lang", LANG);
  const ob = document.getElementById("onboarding");
  if (ob) {
    ob.style.transition = "opacity 240ms ease";
    ob.style.opacity = "0";
    setTimeout(() => ob.remove(), 250);
  }
  try { apiJson("/api/me/lang", "POST", { lang: LANG }); } catch (e) {}
  startApp();
}

const SLIDES = [
  { emoji: "🧾", tk: "sl1_t", dk: "sl1_d" },
  { emoji: "🤝", tk: "sl2_t", dk: "sl2_d" },
  { emoji: "📊", tk: "sl3_t", dk: "sl3_d" },
];

function renderOnboarding(step) {
  let ob = document.getElementById("onboarding");
  if (!ob) {
    ob = document.createElement("div");
    ob.id = "onboarding";
    document.body.appendChild(ob);
  }

  // Шаг 0 — приветствие + выбор языка
  if (step === 0) {
    ob.innerHTML = `
      <div class="onb-body">
        <div class="onb-emoji">🧾</div>
        <div class="onb-title">${t("onb1_title")}</div>
        <div class="onb-desc">${t("onb1_sub")}</div>
        <div class="section-title" style="text-align:center;margin-top:0">${t("choose_lang")}</div>
        <div class="onb-langs">
          <div class="onb-lang ${LANG === "ru" ? "on" : ""}" data-lang="ru">🇷🇺 Русский</div>
          <div class="onb-lang ${LANG === "uz" ? "on" : ""}" data-lang="uz">🇺🇿 O'zbekcha</div>
          <div class="onb-lang ${LANG === "en" ? "on" : ""}" data-lang="en">🇬🇧 English</div>
        </div>
        <button class="btn" id="onbNext0">${t("continue_btn")}</button>
      </div>`;
    ob.querySelectorAll(".onb-lang").forEach((p) =>
      p.addEventListener("click", () => {
        haptic();
        LANG = p.dataset.lang;
        localStorage.setItem("tolash_lang", LANG);
        applyTabLabels();
        renderOnboarding(0);
      }));
    ob.querySelector("#onbNext0").addEventListener("click", () => { haptic(); renderOnboarding(1); });
    return;
  }

  // Шаг 1 — номер телефона (регистрация)
  if (step === 1) {
    ob.innerHTML = `
      <div class="onb-body">
        <div class="onb-emoji">📱</div>
        <div class="onb-title">${t("onb_phone_t")}</div>
        <div class="onb-desc">${t("onb_phone_d")}</div>
        <button class="btn" id="onbPhoneBtn">${t("onb_phone_btn")}</button>
        <button class="onb-later" id="onbLater">${t("later")}</button>
      </div>`;
    // Если номер уже есть в базе (регистрировался через бота) — шаг пропускается
    api("/api/me").then((p) => {
      if (p && p.phone) renderOnboarding(2);
    }).catch(() => {});
    ob.querySelector("#onbPhoneBtn").addEventListener("click", () => {
      haptic("medium");
      if (tg.requestContact) {
        tg.requestContact((shared) => {
          if (shared) {
            toast(t("phone_done"));
            renderOnboarding(2);
          }
        });
      } else {
        // Старый клиент Telegram без requestContact — номер попросит бот
        renderOnboarding(2);
      }
    });
    ob.querySelector("#onbLater").addEventListener("click", () => { haptic(); renderOnboarding(2); });
    return;
  }

  // Шаги 2–4 — слайды о сервисе (можно пропустить)
  const i = step - 2;
  if (i >= SLIDES.length) { finishOnboarding(); return; }
  const s = SLIDES[i];
  const dots = SLIDES.map((_, n) => `<div class="onb-dot ${n === i ? "on" : ""}"></div>`).join("");
  ob.innerHTML = `
    <button class="onb-skip" id="onbSkip">${t("skip")}</button>
    <div class="onb-body">
      <div class="onb-emoji">${s.emoji}</div>
      <div class="onb-title">${t(s.tk)}</div>
      <div class="onb-desc">${t(s.dk)}</div>
      <div class="onb-dots">${dots}</div>
      <button class="btn" id="onbNext">${i === SLIDES.length - 1 ? t("lets_go") : t("next")}</button>
    </div>`;
  ob.querySelector("#onbSkip").addEventListener("click", () => { haptic(); finishOnboarding(); });
  ob.querySelector("#onbNext").addEventListener("click", () => { haptic(); renderOnboarding(step + 1); });
}

/* ============================================================
   Точка входа
   ============================================================ */
(function init() {
  applyTabLabels();
  // Проверка конфигурации: если заглушки не заменены — объясняем разработчику,
  // что именно вписать (вместо бесконечных сетевых ошибок).
  if (API_BASE.includes("example.com") || BOT_USERNAME === "YOUR_BOT_USERNAME") {
    document.getElementById("pages").innerHTML = `
      <div class="card" style="margin-top:24px;border:2px solid var(--red)">
        <div style="font-weight:800;font-size:16px;margin-bottom:8px">⚠️ Приложение не настроено</div>
        <div style="font-size:13.5px;line-height:1.6;color:var(--hint)">
          В начале файла <b>frontend/index.html</b> замените:<br><br>
          1. <b>API_BASE</b> → адрес backend с Render,<br>
          например <i>https://tolash-xxxx.onrender.com</i><br><br>
          2. <b>BOT_USERNAME</b> → username вашего бота из BotFather
          (без @), например <i>tolash_uz_bot</i><br><br>
          Сейчас: <code>${esc(API_BASE)}</code> / <code>${esc(BOT_USERNAME)}</code><br><br>
          Подробнее — README, шаг 5.
        </div>
      </div>`;
    document.getElementById("tabbar").style.display = "none";
    return;
  }
  if (!initData) {
    document.getElementById("pages").innerHTML =
      `<div class="empty" style="padding-top:30vh"><div class="ico">🧾</div><div class="t">${t("open_via_tg")}</div></div>`;
    document.getElementById("tabbar").style.display = "none";
    return;
  }

  // Реферальная ссылка: t.me/<бот>?startapp=ref_<id> — это не счёт
  if (currentBillId && String(currentBillId).startsWith("ref_")) {
    const refId = Number(String(currentBillId).slice(4));
    currentBillId = null;
    if (refId) {
      apiJson("/api/friends/referral", "POST", { ref_id: refId })
        .then((r) => { if (r && r.ok && r.friend) toast("🤝 " + r.friend); })
        .catch(() => {});
    }
  }

  // Первый запуск — онбординг: язык → телефон → слайды
  if (!localStorage.getItem(ONB_KEY)) {
    renderOnboarding(0);
    return;
  }
  startApp();
})();
</script>
</body>
</html>
